name: hourglass
description: A calm, lightweight Android proxy client.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  sing_box:
    path: packages/sing_box
  yaml: ^3.1.4
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/hourglass_icon.png
    - assets/datas/geoip/cn.srs
    - assets/datas/geosite/cn.srs
    - assets/datas/geosite/category-ads-all.srs
